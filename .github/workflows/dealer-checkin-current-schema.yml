name: Operations current schema runtime
on:
  pull_request:
    paths:
      - '.github/workflows/dealer-checkin-current-schema.yml'
      - 'VinPoker/scripts/ops/restore-schema-test-baseline.mjs'
      - 'VinPoker/supabase/migrations/20270128000014_dealer_checkin_club_shift_receipt_v1.sql'
      - 'VinPoker/tests/dealerSwing/checkin*'
      - 'VinPoker/src/components/cashier/DealerSwingTab.tsx'
      - 'VinPoker/supabase/migrations/20270128000016_chip_color_up_serialized_integrity_v1.sql'
      - 'VinPoker/tests/chipOps/colorUpCurrentSchema.pg17.sql'
      - 'VinPoker/tests/chipOps/colorUpIntegrity.pg17.test.mjs'
      - 'VinPoker/supabase/migrations/20270128000017_dealer_operational_inventory_exact_session_v1.sql'
      - 'VinPoker/tests/dealerSwing/operationalInventory*'
      - 'VinPoker/supabase/migrations/20270128000018_dealer_mass_open_canonical_sessions_v1.sql'
      - 'VinPoker/tests/dealerSwing/massOpenSessions.pg17.sql'
      - 'VinPoker/supabase/migrations/20270128000019_dealer_manual_assignment_receipt_read_v1.sql'
      - 'VinPoker/supabase/functions/run-dealer-ready-backup/**'
      - 'VinPoker/supabase/functions/process-swing-on-dealer-ready/**'
      - 'VinPoker/supabase/functions/process-swing/index.ts'
      - 'VinPoker/supabase/functions/process-swing/executionSafety*'
      - 'VinPoker/supabase/functions/_shared/internal-trigger-auth.ts'
      - 'VinPoker/supabase/functions/_shared/__tests__/backupServiceAuth.test.ts'
      - 'VinPoker/supabase/migrations/20270128000020_dealer_ready_backup_private_cron_v1.sql'
      - 'VinPoker/tests/dealerSwing/backupCron*.sql'
      - 'VinPoker/supabase/migrations/20270128000021_dealer_ready_private_trigger_v1.sql'
      - 'VinPoker/tests/dealerSwing/readyTrigger*.sql'
      - 'VinPoker/supabase/migrations/20270128000022_dealer_assignment_off_commit_fence_v1.sql'
      - 'VinPoker/tests/dealerSwing/offCommit*'
      - 'VinPoker/tests/dealerSwing/emptyReservation*'
      - 'VinPoker/supabase/migrations/20270128000023_dealer_empty_reservation_exact_session_v2.sql'
      - 'VinPoker/supabase/functions/process-swing/passes/passS2-empty-table-preassign*'
      - 'VinPoker/supabase/functions/tournament-historical-settlement-worker/**'
      - 'VinPoker/supabase/functions/tournament-historical-settlement-dispatcher/**'
      - 'VinPoker/supabase/functions/_shared/trackerSettlement/historyWorkerPolicy.ts'
      - 'VinPoker/tests/trackerSettlement/scopedClaim*'
      - 'VinPoker/tests/trackerSettlement/historyWorkerPolicy.test.ts'
      - 'VinPoker/supabase/migrations/20270128000024_tracker_history_scoped_canary_claim_v1.sql'
      - 'VinPoker/supabase/migrations/20270128000025_dealer_automatic_rest_history_fence_v1.sql'
      - 'VinPoker/tests/dealerSwing/restHistory*'
      - 'VinPoker/supabase/migrations/20270128000026_floor_open_session_name_integrity_v1.sql'
      - 'VinPoker/tests/floorProduction/openSessionNames.pg17.sql'
      - 'VinPoker/supabase/migrations/20270128000029_floor_deferred_break_intent_v1.sql'
      - 'VinPoker/tests/floorProduction/deferredMoveIntent*'
      - 'VinPoker/supabase/migrations/20270128000030_tracker_roster_intent_fence_v1.sql'
      - 'VinPoker/tests/floorProduction/trackerRoster*'
      - 'VinPoker/supabase/migrations/20270128000027_tracker_equal_blinds_contract_v1.sql'
      - 'VinPoker/tests/floorProduction/equalBlinds.pg17.sql'
      - 'VinPoker/src/lib/tournament/readBlindLineage.ts'
      - 'VinPoker/tests/handinput/readHandBlindLevel.test.ts'
      - 'VinPoker/supabase/functions/_shared/trackerSettlement/historicalDisplayVerification.ts'
      - 'VinPoker/tests/trackerSettlement/historicalDisplayVerification.test.ts'
      - 'VinPoker/supabase/functions/_shared/trackerSettlement/historyWorkerAuth*'
      - 'VinPoker/supabase/functions/_shared/trackerSettlement/historyWorkerHandler.test.ts'
      - 'VinPoker/supabase/functions/_shared/dealerMutationIntent.ts'
      - 'VinPoker/supabase/functions/_shared/__tests__/dealerMutationIntent.test.ts'
      - 'VinPoker/supabase/functions/assign-dealer/**'
      - 'VinPoker/supabase/functions/mass-assign/**'
      - 'VinPoker/supabase/functions/checkout-dealer/**'
permissions: { actions: read, contents: read }
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: vinpoker_ops_checkin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_checkin
      SCHEMA_ARTIFACT_DIR: /tmp/vinpoker-current-schema
      SCHEMA_ARTIFACT_SHA256: d23cfa75a7381453ba0d6216346f6460c816a3b1525ef5d47984c3a995ddc56a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Install locked Node types required by the existing Supabase import graph
        working-directory: VinPoker
        run: npm ci --ignore-scripts
      - name: Backup worker rejects unauthenticated privileged execution
        working-directory: VinPoker
        run: |
          deno check supabase/functions/run-dealer-ready-backup/index.ts
          deno check supabase/functions/process-swing-on-dealer-ready/index.ts
          deno check supabase/functions/process-swing/index.ts
          deno check supabase/functions/assign-dealer/index.ts supabase/functions/mass-assign/index.ts supabase/functions/checkout-dealer/index.ts
          deno test --allow-env supabase/functions/run-dealer-ready-backup/auth.test.ts supabase/functions/_shared/__tests__/backupServiceAuth.test.ts supabase/functions/process-swing-on-dealer-ready/runtime.test.ts
          deno test supabase/functions/process-swing/executionSafety.test.ts
          deno test supabase/functions/_shared/__tests__/dealerMutationIntent.test.ts
          deno test --allow-env supabase/functions/process-swing/passes/passS2-empty-table-preassign.test.ts
          deno check supabase/functions/tournament-historical-settlement-worker/index.ts
          deno check supabase/functions/tournament-historical-settlement-dispatcher/index.ts
          deno test --allow-env supabase/functions/tournament-historical-settlement-worker/runtime.test.ts supabase/functions/tournament-historical-settlement-dispatcher/runtime.test.ts
          deno test --allow-read supabase/functions/_shared/trackerSettlement/historyWorkerAuth.test.ts supabase/functions/_shared/trackerSettlement/historyWorkerHandler.test.ts
          node node_modules/vitest/vitest.mjs run tests/trackerSettlement/historyWorkerPolicy.test.ts
          node node_modules/vitest/vitest.mjs run tests/handinput/readHandBlindLevel.test.ts tests/trackerSettlement/historicalDisplayVerification.test.ts
      - name: Download exact owner-authorized current schema (not a pre-release replay baseline)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .head_sha)" = 0463831bb9f8f142d585fd51c1b0633963b2161f
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781/artifacts" --jq '[.artifacts[] | select(.name=="live-public-schema" and .expired==false)] | if length==1 then .[0].id else error("exact schema artifact missing") end')"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/schema.zip"
          unzip -q "$RUNNER_TEMP/schema.zip" -d "$SCHEMA_ARTIFACT_DIR"
          node VinPoker/scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
      - name: Restore current schema and apply exact new migration
        working-directory: VinPoker
        run: |
          node scripts/ops/restore-schema-test-baseline.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000013_floor_mode_request_safe_boundary_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000014_dealer_checkin_club_shift_receipt_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/checkin.pg17.sql
          node tests/dealerSwing/checkin.concurrent.mjs
      - name: Chip integrity on exact current schema
        working-directory: VinPoker
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000015_floor_restore_bust_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000016_chip_color_up_serialized_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/chipOps/colorUpCurrentSchema.pg17.sql
      - name: Chip concurrency in isolated minimal fixture (not schema parity evidence)
        working-directory: VinPoker
        run: |
          createdb vinpoker_chip_concurrency
          PGDATABASE=vinpoker_chip_concurrency node --test tests/chipOps/colorUpIntegrity.pg17.test.mjs
      - name: Exact-session dealer inventory and true-overlap assignment
        working-directory: VinPoker
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000017_dealer_operational_inventory_exact_session_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/operationalInventory.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000018_dealer_mass_open_canonical_sessions_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000019_dealer_manual_assignment_receipt_read_v1.sql
          node tests/dealerSwing/operationalInventory.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/massOpenSessions.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000022_dealer_assignment_off_commit_fence_v1.sql
          node tests/dealerSwing/offCommit.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000023_dealer_empty_reservation_exact_session_v2.sql
          node tests/dealerSwing/emptyReservation.currentSchema.mjs
          createdb -T "$PGDATABASE" vinpoker_ops_reservation_identity
          PGDATABASE=vinpoker_ops_reservation_identity node tests/dealerSwing/emptyReservation.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000024_tracker_history_scoped_canary_claim_v1.sql
          node tests/trackerSettlement/scopedClaim.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000025_dealer_automatic_rest_history_fence_v1.sql
          node tests/dealerSwing/restHistory.currentSchema.mjs
          node tests/dealerSwing/restHistory.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000026_floor_open_session_name_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/openSessionNames.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000027_tracker_equal_blinds_contract_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/equalBlinds.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000028_tracker_roster_exact_session_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000029_floor_deferred_break_intent_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000030_tracker_roster_intent_fence_v1.sql
          psql -X -v ON_ERROR_STOP=1 -v LATE_PHYSICAL_REQUEST_CASE=1 -f tests/floorProduction/trackerRosterSession.pg17.sql
          node tests/floorProduction/trackerRosterIntent.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v TRACKER_BREAK_CASE=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v TRACKER_BREAK_CASE=1 -v REAL_FINISH_CASE=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v TRACKER_BREAK_CASE=1 -v CANCEL_CASE=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v TRACKER_BREAK_CASE=1 -v STALE_EPOCH_CASE=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
          node tests/floorProduction/deferredMoveIntent.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -v TRACKER_BREAK_CASE=1 -v BAD_RECEIPT_CASE=1 -f tests/floorProduction/deferredMoveIntent.pg17.sql
      - name: OFF-at-commit true-overlap with isolated acquisition fixture (not live worker proof)
        working-directory: VinPoker
        run: |
          createdb vinpoker_ops_off_fence
          PGDATABASE=vinpoker_ops_off_fence psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/offCommit.fixture.pg17.sql
          PGDATABASE=vinpoker_ops_off_fence psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000022_dealer_assignment_off_commit_fence_v1.sql
          PGDATABASE=vinpoker_ops_off_fence psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/offCommit.pg17.sql
          PGDATABASE=vinpoker_ops_off_fence node tests/dealerSwing/offCommit.concurrent.mjs
      - name: Private backup cron contract with isolated network doubles (not live scheduler proof)
        working-directory: VinPoker
        run: |
          createdb vinpoker_ops_backup_cron
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/backupCron.fixture.pg17.sql
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000020_dealer_ready_backup_private_cron_v1.sql
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/backupCron.pg17.sql
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/readyTrigger.fixture.pg17.sql
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000021_dealer_ready_private_trigger_v1.sql
          PGDATABASE=vinpoker_ops_backup_cron psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/readyTrigger.pg17.sql
