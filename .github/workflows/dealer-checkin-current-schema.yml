permissions: { actions: read, contents: read }
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55441
      PGUSER: postgres
      PGDATABASE: vinpoker_ops_checkin
      SCHEMA_ARTIFACT_DIR: /tmp/vinpoker-current-schema
      SCHEMA_ARTIFACT_SHA256: d23cfa75a7381453ba0d6216346f6460c816a3b1525ef5d47984c3a995ddc56a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Exact Floor package preparation rejects drift (offline only)
        working-directory: VinPoker
        run: node --test scripts/ops/floor-37-47-release-plan.test.mjs scripts/ops/floor-37-47-protected-apply.test.mjs scripts/ops/floor-48-release-plan.test.mjs scripts/ops/floor-48-protected-apply.test.mjs
      - name: Install locked Node types required by the existing Supabase import graph
        working-directory: VinPoker
        run: npm ci --ignore-scripts
      - name: Check-in retry identity and React lifecycle regressions
        working-directory: VinPoker
        run: |
          node --test tests/dealerSwing/checkinHandler.repro.mjs
          node --test scripts/ops/dealer-checkin-51-protected-apply.test.mjs scripts/ops/dealer-checkin-51-atomic-pg.test.mjs
          node --test scripts/ops/restore-chip-52-53-release-plan.test.mjs scripts/ops/restore-chip-52-53-protected-apply.test.mjs scripts/ops/restore-chip-52-53-atomic-pg.test.mjs
          node node_modules/vitest/vitest.mjs run src/components/chip-ops/ColorUpTab.test.tsx src/components/cashier/tournament-live/RestoreBustDialog.test.tsx src/lib/floorTableControlV3.test.ts --maxWorkers=1 --minWorkers=1
          node node_modules/vitest/vitest.mjs run tests/dealerSwing/checkinReactLifecycle.test.tsx tests/dealerSwing/attentionCoverage.test.tsx tests/dealerSwing/floorV3InventoryConvergence.test.ts tests/dealerSwing/closeDealerTablesRpcLineage.test.ts --maxWorkers=1 --minWorkers=1
      - name: Backup worker rejects unauthenticated privileged execution
        working-directory: VinPoker
        run: |
          deno check supabase/functions/run-dealer-ready-backup/index.ts
          deno check supabase/functions/process-swing-on-dealer-ready/index.ts
          deno check supabase/functions/process-swing/index.ts
          deno check supabase/functions/assign-dealer/index.ts supabase/functions/mass-assign/index.ts supabase/functions/checkout-dealer/index.ts
          deno test --allow-env supabase/functions/run-dealer-ready-backup/auth.test.ts supabase/functions/_shared/__tests__/backupServiceAuth.test.ts supabase/functions/process-swing-on-dealer-ready/runtime.test.ts
          deno test supabase/functions/process-swing/executionSafety.test.ts
          deno test supabase/functions/_shared/__tests__/dealerMutationIntent.test.ts
          deno test --allow-env supabase/functions/process-swing/passes/passS2-empty-table-preassign.test.ts
          deno check supabase/functions/tournament-historical-settlement-worker/index.ts
          deno check supabase/functions/tournament-historical-settlement-dispatcher/index.ts
          deno test --allow-env supabase/functions/tournament-historical-settlement-worker/runtime.test.ts supabase/functions/tournament-historical-settlement-dispatcher/runtime.test.ts
          deno test --allow-read supabase/functions/_shared/trackerSettlement/historyWorkerAuth.test.ts supabase/functions/_shared/trackerSettlement/historyWorkerHandler.test.ts
          node node_modules/vitest/vitest.mjs run tests/trackerSettlement/historyWorkerPolicy.test.ts
          node node_modules/vitest/vitest.mjs run tests/trackerSettlement/historicalDisplayMigration.contract.test.ts
          node node_modules/vitest/vitest.mjs run tests/handinput/readHandBlindLevel.test.ts tests/trackerSettlement/historicalDisplayVerification.test.ts
          node node_modules/vitest/vitest.mjs run src/lib/tournamentParticipation.test.ts
      - name: Download exact owner-authorized current schema (not a pre-release replay baseline)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781" --jq .head_sha)" = 0463831bb9f8f142d585fd51c1b0633963b2161f
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37820347781/artifacts" --jq '[.artifacts[] | select(.name=="live-public-schema" and .expired==false)] | if length==1 then .[0].id else error("exact schema artifact missing") end')"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/schema.zip"
          unzip -q "$RUNNER_TEMP/schema.zip" -d "$SCHEMA_ARTIFACT_DIR"
          node VinPoker/scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$SCHEMA_ARTIFACT_DIR"
      - name: Start isolated PostgreSQL 17 on actual loopback (no bridge address exception)
        run: |
          docker run --detach --name vinpoker-current-schema-pg17 --network host \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=vinpoker_ops_checkin \
            postgres:17 -c listen_addresses=127.0.0.1 -c port=55441
          ready=false
          for attempt in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT inet_server_addr()='127.0.0.1'::inet AND current_database()='vinpoker_ops_checkin' AND current_user='postgres' AND current_setting('server_version_num')::int BETWEEN 170000 AND 179999")" = t
      - name: Floor package atomic ledger and receipt-failure rollback (isolated database)
        working-directory: VinPoker
        run: node scripts/ops/floor-37-47-release-plan.pg17.mjs
      - name: Restore current schema and apply exact new migration
        working-directory: VinPoker
        run: |
          node scripts/ops/restore-schema-test-baseline.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000013_floor_mode_request_safe_boundary_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000014_dealer_checkin_club_shift_receipt_v1.sql
          createdb -T "$PGDATABASE" vinpoker_ops_dealer51_atomic_ci
          PGDATABASE=vinpoker_ops_dealer51_atomic_ci DEALER51_PG_TEST=1 node --test scripts/ops/dealer-checkin-51-atomic-pg.test.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/checkin.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000051_dealer_checkin_receipt_reconciliation_v1.sql
          psql -X -v ON_ERROR_STOP=1 -v receipt_reconciliation_case=true -f tests/dealerSwing/checkin.pg17.sql
          node tests/dealerSwing/checkin.concurrent.mjs
      - name: Chip integrity on exact current schema
        working-directory: VinPoker
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000015_floor_restore_bust_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000016_chip_color_up_serialized_integrity_v1.sql
          createdb -T "$PGDATABASE" vinpoker_ops_restore_chip_atomic
          PGDATABASE=vinpoker_ops_restore_chip_atomic RESTORE_CHIP_PG_TEST=1 node --test scripts/ops/restore-chip-52-53-atomic-pg.test.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/chipOps/colorUpCurrentSchema.pg17.sql
      - name: Chip concurrency in isolated minimal fixture (not schema parity evidence)
        working-directory: VinPoker
        run: |
          createdb vinpoker_chip_concurrency
          PGDATABASE=vinpoker_chip_concurrency node --test tests/chipOps/colorUpIntegrity.pg17.test.mjs
          PGDATABASE=vinpoker_chip_concurrency psql -X -v ON_ERROR_STOP=1 -f tests/chipOps/colorUpReceipt.pg17.sql
          PGDATABASE=vinpoker_chip_concurrency psql -X -v ON_ERROR_STOP=1 -f tests/chipOps/colorUpCancellation.pg17.sql
          PGDATABASE=vinpoker_chip_concurrency node tests/chipOps/colorUpCancellation.concurrent.mjs
      - name: Exact-session dealer inventory and true-overlap assignment
        working-directory: VinPoker
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000017_dealer_operational_inventory_exact_session_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/operationalInventory.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000018_dealer_mass_open_canonical_sessions_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000019_dealer_manual_assignment_receipt_read_v1.sql
          node tests/dealerSwing/operationalInventory.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f tests/dealerSwing/massOpenSessions.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000022_dealer_assignment_off_commit_fence_v1.sql
          node tests/dealerSwing/offCommit.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000023_dealer_empty_reservation_exact_session_v2.sql
          node tests/dealerSwing/emptyReservation.currentSchema.mjs
          createdb -T "$PGDATABASE" vinpoker_ops_reservation_identity
          PGDATABASE=vinpoker_ops_reservation_identity node tests/dealerSwing/emptyReservation.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000024_tracker_history_scoped_canary_claim_v1.sql
          node tests/trackerSettlement/scopedClaim.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000025_dealer_automatic_rest_history_fence_v1.sql
          node tests/dealerSwing/restHistory.currentSchema.mjs
          node tests/dealerSwing/restHistory.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000026_floor_open_session_name_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/openSessionNames.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000027_tracker_equal_blinds_contract_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/equalBlinds.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000028_tracker_roster_exact_session_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000029_floor_deferred_break_intent_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000030_tracker_roster_intent_fence_v1.sql
          psql -X -v ON_ERROR_STOP=1 -v LATE_PHYSICAL_REQUEST_CASE=1 -f tests/floorProduction/trackerRosterSession.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v STALE_STACK_FIRST_ARRIVAL_CASE=1 -f tests/floorProduction/trackerRosterSession.pg17.sql
          node tests/floorProduction/trackerRosterIntent.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000031_tournament_participation_current_scope_v1.sql
          psql -X -v ON_ERROR_STOP=1 -v CLOSED_SESSION_READ_CASE=1 -f tests/floorProduction/trackerRosterSession.pg17.sql
          node tests/floorProduction/participationTv.concurrent.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000032_tournament_seat_display_preservation_v1.sql
          node tests/floorProduction/seatDisplayRollback.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000033_tournament_seat_move_tuple_v1.sql
          node tests/floorProduction/seatMoveTupleRollback.currentSchema.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000034_floor_move_wrapper_receipt_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000035_tournament_seat_assign_integrity_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/floorProduction/assignParticipation.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v free_sit_roundtrip=true -f tests/floorProduction/assignParticipation.pg17.sql
          psql -X -v ON_ERROR_STOP=1 -v seed_chip_projection=true -v projection_stack=20001 -f tests/floorProduction/assignParticipation.pg17.sql
          node tests/floorProduction/assignIntegrityRollback.currentSchema.mjs
