name: Ops SePay scope repair and Quant Q0 - exact apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preflight or guarded three-step apply"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      source_sha:
        description: "Exact reviewed main SHA"
        required: true
        type: string
      confirmation:
        description: "For apply: APPLY_SEPAY_SCOPE_AND_Q0_20270114000000"
        required: true
        default: HOLD
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ops-sepay-scope-q0-exact-apply
  cancel-in-progress: false

env:
  CRITICAL_ENVIRONMENT: dealer-swing-production-critical

jobs:
  validate-critical-environment:
    name: Require protected production reviewers
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless the critical environment has reviewers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${CRITICAL_ENVIRONMENT}")"
          jq -e '.protection_rules | any(.type == "required_reviewers" and ((.reviewers // []) | length > 0))' \
            <<<"$environment_json" >/dev/null

  exact-apply:
    needs: validate-critical-environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dealer-swing-production-critical
    steps:
      - name: Checkout exact reviewed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact source and apply confirmation
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$INPUT_SOURCE_SHA"
          if [[ "$INPUT_MODE" == "apply" ]]; then
            test "$INPUT_CONFIRMATION" = "APPLY_SEPAY_SCOPE_AND_Q0_20270114000000"
          else
            test "$INPUT_MODE" = "preflight"
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validate exact runner and dark source
        working-directory: VinPoker
        run: node --test scripts/ops/apply-sepay-scope-q0.test.mjs

      - name: Read-only live preflight
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
        run: node scripts/ops/apply-sepay-scope-q0.mjs --preflight

      - name: Disable Royal sandbox claim, repair exact scope conflict, apply Q0, and verify
        if: inputs.mode == 'apply'
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          CONFIRM_APPLY_SEPAY_SCOPE_Q0: APPLY_SEPAY_SCOPE_AND_Q0_20270114000000
        run: node scripts/ops/apply-sepay-scope-q0.mjs --apply
