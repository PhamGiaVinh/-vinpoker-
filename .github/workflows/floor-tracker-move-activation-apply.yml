name: Floor Tracker move activation - exact migration apply

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact reviewed main SHA containing migration 20270115000012"
        required: true
        type: string
      mode:
        description: "Read-only preflight or exact apply"
        required: true
        default: preflight
        type: choice
        options: [preflight, apply]
      confirmation:
        description: "For apply: APPLY_FLOOR_TRACKER_MOVE_20270115000012"
        required: true
        default: HOLD
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: floor-tracker-move-activation-exact-apply
  cancel-in-progress: false

env:
  CRITICAL_ENVIRONMENT: dealer-swing-production-critical

jobs:
  validate-critical-environment:
    name: Require protected critical environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless required reviewers are configured
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${CRITICAL_ENVIRONMENT}")"
          jq -e '.protection_rules | any(.type == "required_reviewers" and ((.reviewers // []) | length > 0))' \
            <<<"$environment_json" >/dev/null

  exact-apply:
    needs: validate-critical-environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dealer-swing-production-critical
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact SHA and owner confirmation
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          APPLY_MODE: ${{ inputs.mode }}
          APPLY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          if [[ "$APPLY_MODE" == "apply" ]]; then
            test "$APPLY_CONFIRMATION" = "APPLY_FLOOR_TRACKER_MOVE_20270115000012"
          else
            test "$APPLY_MODE" = "preflight"
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validate exact workflow contract
        working-directory: VinPoker
        run: node --test scripts/floor/floor-tracker-activation-workflow.test.mjs

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.101.0

      - name: Link production project
        working-directory: VinPoker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Prove exact migration plan and optionally apply
        working-directory: VinPoker
        shell: bash
        env:
          APPLY_MODE: ${{ inputs.mode }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          hold="${RUNNER_TEMP}/floor-tracker-00012-hold"
          mkdir -p "$hold"
          excluded=(
            20260925115949_public_table_history_verified_results.sql
            20270115000015_tracker_voice_dealer_handoff_authority.sql
          )
          restore_catalog() {
            for name in "${excluded[@]}"; do
              if [[ -f "$hold/$name" ]]; then
                mv "$hold/$name" "supabase/migrations/$name"
              fi
            done
          }
          trap restore_catalog EXIT
          for name in "${excluded[@]}"; do
            test -f "supabase/migrations/$name"
            mv "supabase/migrations/$name" "$hold/$name"
          done

          dry_run="$(supabase db push --linked --include-all --dry-run 2>&1)"
          printf '%s\n' "$dry_run"
          mapfile -t planned < <(sed -nE 's/^[[:space:]]*[•-]?[[:space:]]*([0-9]{14}_[^[:space:]]+\.sql)[[:space:]]*$/\1/p' <<<"$dry_run")
          test "${#planned[@]}" -eq 1
          test "${planned[0]}" = "20270115000012_floor_tracker_move_activation_v1.sql"
          echo "EXACT_SCOPE_DRY_RUN=PASS"

          if [[ "$APPLY_MODE" == "apply" ]]; then
            supabase db push --linked --include-all --yes
          fi

      - name: Verify ledger and exact ACL state
        if: inputs.mode == 'apply'
        working-directory: VinPoker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/floor/verify-floor-tracker-activation.mjs
