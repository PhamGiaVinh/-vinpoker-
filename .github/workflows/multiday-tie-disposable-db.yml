name: Multi-day tie arithmetic disposable PostgreSQL 17

on:
  pull_request:
    paths:
      - ".github/workflows/multiday-tie-disposable-db.yml"
      - "VinPoker/supabase/pending-migrations/20270119000001_multiday_equal_tie_entitlement_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_equal_tie_entitlement_v1.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiday-tie-disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic Supabase roles
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
      - name: Apply exact pending helper in disposable database
        working-directory: VinPoker
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20270119000001_multiday_equal_tie_entitlement_v1.sql
      - name: Assert tie arithmetic and internal-only privilege
        working-directory: VinPoker
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/pending-tests/multiday_equal_tie_entitlement_v1.sql
