name: Restore chip52–55 exact protected migration apply
on:
  workflow_dispatch:
    inputs:
      release_sha: {description: Exact reviewed source SHA, required: true, type: string}
      source_pr: {description: Exact open source PR number, required: true, type: string}
      recovery_run_id: {description: Successful fresh restore-verified recovery run, required: true, type: string}
      recovery_base_sha: {description: Exact main SHA that created recovery, required: true, type: string}
      confirmation: {description: APPLY_RESTORE_CHIP_52_55_<release_sha>, required: true, type: string}
permissions: {actions: read, contents: read, checks: read, pull-requests: read}
concurrency: {group: vinpoker-production-database-release, cancel-in-progress: false}
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.release_sha }}', fetch-depth: 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Bind owner, open source PR and exact-SHA checks
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_SHA: '${{ inputs.release_sha }}'
          SOURCE_PR: '${{ inputs.source_pr }}'
          INITIAL_ACTOR: '${{ github.actor }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          CONFIRMATION: '${{ inputs.confirmation }}'
        run: |
          set -euo pipefail
          test "$INITIAL_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_PR" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$CONFIRMATION" = "APPLY_RESTORE_CHIP_52_55_$RELEASE_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")"
          test "$(jq -r .head.sha <<<"$pr")" = "$RELEASE_SHA"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY"
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          for name in runtime postgres-17-integrated release-runner-postgres-17 collision-guard reject-sensitive-vars-context 'Floor V3 catalog and promotion preflight'; do
            jq -e --arg name "$name" '[.check_runs[]|select(.name==$name)]|sort_by(.id)|last|.status=="completed" and .conclusion=="success"' <<<"$checks" >/dev/null
          done
      - name: Offline exact migration checks
        working-directory: VinPoker
        run: |
          npm run check:migration-catalog
          node --test scripts/ops/restore-chip-52-53-release-plan.test.mjs scripts/ops/restore-chip-52-53-protected-apply.test.mjs scripts/ops/restore-chip-52-53-atomic-pg.test.mjs scripts/ops/floor-37-47-protected-apply.test.mjs
  apply:
    needs: validate
    environment: dealer-swing-production-critical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.release_sha }}', fetch-depth: 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Verify recovery provenance and download metadata only
        env:
          GH_TOKEN: '${{ github.token }}'
          RECOVERY_RUN_ID: '${{ inputs.recovery_run_id }}'
          RECOVERY_BASE_SHA: '${{ inputs.recovery_base_sha }}'
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RECOVERY_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          test "$(jq -r .workflow_id <<<"$run")" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/floor-v3-recovery-backup.yml" --jq .id)"
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .actor.login <<<"$run")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .head_sha <<<"$run")" = "$RECOVERY_BASE_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts")"
          artifact="$(jq -ce --arg name "floor-v3-restore-verification-$RECOVERY_RUN_ID" '[.artifacts[]|select(.name==$name and .expired==false and .size_in_bytes>0)]|if length==1 then .[0] else error("missing recovery") end' <<<"$artifacts")"
          mkdir "$RUNNER_TEMP/restore-chip52-53-recovery-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(jq -r .id <<<"$artifact")/zip" >"$RUNNER_TEMP/restore-chip52-53-recovery.zip"
          unzip -q "$RUNNER_TEMP/restore-chip52-53-recovery.zip" -d "$RUNNER_TEMP/restore-chip52-53-recovery-receipt"
          echo "RECOVERY_RECEIPT_PATH=$RUNNER_TEMP/restore-chip52-53-recovery-receipt/recovery-verification.json" >>"$GITHUB_ENV"
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[]|select((.id|tostring)!=env.GITHUB_RUN_ID)|select(.event=="workflow_dispatch")|select(.status=="in_progress" or .status=="waiting" or .status=="queued")|select(.name|test("database|migration|recovery|protected.*apply|release";"i"))|.id')"
          test -z "$active"
      - name: Plan then exact atomic52–55 apply
        working-directory: VinPoker
        env:
          RELEASE_SHA: '${{ inputs.release_sha }}'
          SOURCE_CHECKOUT_SHA: '${{ inputs.release_sha }}'
          RECOVERY_BASE_SHA: '${{ inputs.recovery_base_sha }}'
          INITIAL_ACTOR: '${{ github.actor }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          REPOSITORY_OWNER: '${{ github.repository_owner }}'
          SUPABASE_PROJECT_REF: '${{ secrets.SUPABASE_PROJECT_REF }}'
          PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.orlesggcjamwuknxwcpk
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: '${{ secrets.SUPABASE_DB_PASSWORD }}'
          CONFIRM_FLOOR_PACKAGE: '${{ inputs.confirmation }}'
        run: |
          set -euo pipefail
          node scripts/ops/restore-chip-52-53-protected-apply.mjs plan | tee "$RUNNER_TEMP/restore-chip52-53-plan.txt"
          node scripts/ops/restore-chip-52-53-protected-apply.mjs apply | tee "$RUNNER_TEMP/restore-chip52-53-apply.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: restore-chip52-53-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/restore-chip52-53-plan.txt
            ${{ runner.temp }}/restore-chip52-53-apply.txt
          if-no-files-found: warn
          retention-days: 30
