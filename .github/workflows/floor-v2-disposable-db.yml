name: Floor V2 disposable PostgreSQL integration

on:
  pull_request:
    paths:
      - ".github/workflows/floor-v2-disposable-db.yml"
      - "VinPoker/supabase/migrations/20261240000000_floor_production_hardening.sql"
      - "VinPoker/supabase/migrations/20261241000000_floor_clock_start_atomic.sql"
      - "VinPoker/supabase/migrations/20261242000000_floor_operator_scope.sql"
      - "VinPoker/supabase/migrations/20270104000000_floor_cleanup_rotation_schedule_index.sql"
      - "VinPoker/supabase/migrations/20270104000001_floor_chip_cas_rpc.sql"
      - "VinPoker/supabase/migrations/20270104000004_floor_clock_control_atomic.sql"
      - "VinPoker/supabase/migrations/20270104000005_floor_operator_scope_acl.sql"
      - "VinPoker/src/components/ops/shared/FloorPlayerActions.tsx"
      - "VinPoker/src/components/ops/shared/PlayerActionSheets.tsx"
      - "VinPoker/src/components/ops/shared/floorSeatEntryPreflight.ts"
      - "VinPoker/src/lib/floorOpsErrors.ts"
      - "VinPoker/src/pages/ops/OpsTables.tsx"
      - "VinPoker/tests/floorProduction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-disposable-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Node runtime for Floor source checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - name: Install locked Floor source dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Run targeted Floor mobile regressions
        working-directory: VinPoker
        run: >-
          npx vitest run
          tests/floorProduction/floorSeatEntryPreflight.test.ts
          tests/floorProduction/floorOpsErrors.test.ts
          tests/floorProduction/playerActionSheets.render.test.tsx

      - name: Lint targeted Floor mobile source
        working-directory: VinPoker
        run: >-
          npx eslint
          src/components/ops/shared/FloorPlayerActions.tsx
          src/components/ops/shared/PlayerActionSheets.tsx
          src/components/ops/shared/floorSeatEntryPreflight.ts
          src/lib/floorOpsErrors.ts
          src/pages/ops/OpsTables.tsx
          tests/floorProduction/floorSeatEntryPreflight.test.ts
          tests/floorProduction/floorOpsErrors.test.ts
          tests/floorProduction/playerActionSheets.render.test.tsx

      - name: Apply Floor V2 migrations to disposable PostgreSQL and run integration assertions
        working-directory: VinPoker
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f tests/floorProduction/disposableDb.integration.sql
