name: Dealer PT wage readiness ACL - exact migration apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preflight or exact apply"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      confirmation:
        description: "For apply: APPLY_DEALER_PT_WAGE_READINESS_ACL_20270106000002"
        required: true
        default: HOLD
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: dealer-pt-wage-readiness-acl-exact-apply
  cancel-in-progress: false

env:
  CRITICAL_ENVIRONMENT: dealer-swing-production-critical
  PAYROLL_REPAIR_SOURCE_SHA: 6939b6d72c9533ce68101624b22e7a5be73d3b83

jobs:
  validate-critical-environment:
    name: Require protected critical environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless required reviewers are configured
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${CRITICAL_ENVIRONMENT}")"
          jq -e '
            .protection_rules
            | any(.type == "required_reviewers" and ((.reviewers // []) | length > 0))
          ' <<<"$environment_json" >/dev/null

  exact-apply:
    needs: validate-critical-environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dealer-swing-production-critical
    steps:
      - name: Checkout control-plane runner from this reviewed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 0

      - name: Verify immutable payroll repair source is contained in current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAYROLL_REPAIR_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C control-plane fetch origin main --no-tags
          git -C control-plane merge-base --is-ancestor "$PAYROLL_REPAIR_SOURCE_SHA" origin/main

      - name: Checkout exact payroll repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PAYROLL_REPAIR_SOURCE_SHA }}
          path: payroll-repair-source
          fetch-depth: 1

      - name: Verify exact payroll repair revision and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C payroll-repair-source rev-parse HEAD)" = "$PAYROLL_REPAIR_SOURCE_SHA"
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            test "${{ inputs.confirmation }}" = "APPLY_DEALER_PT_WAGE_READINESS_ACL_20270106000002"
          else
            test "${{ inputs.mode }}" = "preflight"
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validate exact ACL runner and immutable repair source
        working-directory: control-plane/VinPoker
        run: >-
          node --test
          scripts/payroll/apply-dealer-pt-wage-readiness-acl.test.mjs

      - name: Read-only live preflight
        working-directory: control-plane/VinPoker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
        run: >-
          node scripts/payroll/apply-dealer-pt-wage-readiness-acl.mjs
          --preflight
          --source-root "${GITHUB_WORKSPACE}/payroll-repair-source/VinPoker"

      - name: Apply only the approved readiness ACL migration and verify dark post-state
        if: inputs.mode == 'apply'
        working-directory: control-plane/VinPoker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          CONFIRM_APPLY_DEALER_PT_WAGE_READINESS_ACL: APPLY_DEALER_PT_WAGE_READINESS_ACL_20270106000002
        run: >-
          node scripts/payroll/apply-dealer-pt-wage-readiness-acl.mjs
          --apply
          --source-root "${GITHUB_WORKSPACE}/payroll-repair-source/VinPoker"
