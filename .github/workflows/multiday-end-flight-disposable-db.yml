name: Multi-day End Flight disposable PostgreSQL 17

on:
  pull_request:
    paths:
      - ".github/workflows/multiday-end-flight-disposable-db.yml"
      - "VinPoker/supabase/pending-migrations/20270120000000_multiday_end_flight_snapshot_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000001_multiday_bag_revision_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000002_multiday_qualification_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000003_multiday_final_seating_adjustment_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000004_multiday_payout_legacy_hold_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000005_multiday_overlay_funding_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000006_multiday_payout_snapshot_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000007_multiday_payout_source_proof_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000008_multiday_payout_postfinal_adjustment_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270120000009_multiday_floor_read_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270119000001_multiday_equal_tie_entitlement_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_qualification_baseline_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_qualification_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_qualification_race_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_final_seating_baseline_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_final_seating_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_final_seating_race_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_payout_hold_baseline_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_hold_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_overlay_funding_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_source_baseline_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_snapshot_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_postfinal_adjustment_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_postfinal_race_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_floor_read_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_transfer_tie_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_payout_finalize_race_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_overlay_bank_race_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_real_satellite_bridge_v1.sh"
      - "VinPoker/supabase/pending-tests/multiday_real_satellite_bridge_fixture_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_real_satellite_bridge_assert_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_end_flight_baseline_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_end_flight_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_bag_revision_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_end_flight_race_setup_v1.sql"
      - "VinPoker/supabase/pending-tests/multiday_end_flight_race_v1.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiday-end-flight-disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-baseline fixture and forward migration
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-tests/multiday_end_flight_baseline_v1.sql \
            -f supabase/pending-migrations/20270120000000_multiday_end_flight_snapshot_v1.sql \
            -f supabase/pending-tests/multiday_end_flight_v1.sql \
            -f supabase/pending-migrations/20270120000001_multiday_bag_revision_v1.sql \
            -f supabase/pending-tests/multiday_bag_revision_v1.sql \
            -f supabase/pending-tests/multiday_end_flight_race_setup_v1.sql
      - name: Assert serial cutoff versus direct hand writer
        working-directory: VinPoker
        run: bash supabase/pending-tests/multiday_end_flight_race_v1.sh
      - name: Apply qualification baseline, migration and golden tests
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-tests/multiday_qualification_baseline_v1.sql \
            -f supabase/pending-migrations/20270120000002_multiday_qualification_v1.sql \
            -f supabase/pending-tests/multiday_qualification_v1.sql
      - name: Assert qualification serial fence
        working-directory: VinPoker
        run: bash supabase/pending-tests/multiday_qualification_race_v1.sh
      - name: Apply Final Day exact-column baseline and forward migration
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-tests/multiday_final_seating_baseline_v1.sql \
            -f supabase/pending-migrations/20270120000003_multiday_final_seating_adjustment_v1.sql \
            -f supabase/pending-tests/multiday_final_seating_v1.sql
      - name: Assert Final Day no-existing-row serial fence
        working-directory: VinPoker
        run: bash supabase/pending-tests/multiday_final_seating_race_v1.sh
      - name: Assert package payout legacy writers remain held
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-tests/multiday_payout_hold_baseline_v1.sql \
            -f supabase/pending-migrations/20270120000004_multiday_payout_legacy_hold_v1.sql \
            -f supabase/pending-tests/multiday_payout_hold_v1.sql
      - name: Assert evidence-linked overlay and payout snapshot
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-migrations/20270120000005_multiday_overlay_funding_v1.sql \
            -f supabase/pending-migrations/20270119000001_multiday_equal_tie_entitlement_v1.sql \
            -f supabase/pending-tests/multiday_payout_source_baseline_v1.sql \
            -f supabase/pending-migrations/20270120000006_multiday_payout_snapshot_v1.sql \
            -f supabase/pending-migrations/20270120000007_multiday_payout_source_proof_v1.sql \
            -f supabase/pending-tests/multiday_overlay_funding_v1.sql \
            -f supabase/pending-tests/multiday_payout_snapshot_v1.sql \
            -f supabase/pending-tests/multiday_payout_transfer_tie_v1.sql
      - name: Assert append-only post-final correction and approval
        working-directory: VinPoker
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-migrations/20270120000008_multiday_payout_postfinal_adjustment_v1.sql \
            -f supabase/pending-tests/multiday_payout_postfinal_adjustment_v1.sql
          bash supabase/pending-tests/multiday_payout_postfinal_race_v1.sh
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/pending-migrations/20270120000009_multiday_floor_read_v1.sql \
            -f supabase/pending-tests/multiday_floor_read_v1.sql
      - name: Assert atomic payout finalize and source writer race
        working-directory: VinPoker
        run: bash supabase/pending-tests/multiday_payout_finalize_race_v1.sh
      - name: Assert bank proof cannot race Cashier allocation
        working-directory: VinPoker
        run: bash supabase/pending-tests/multiday_overlay_bank_race_v1.sh

  satellite-multiday-real-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact #1344 migration dependency
        uses: actions/checkout@v4
        with:
          path: satellite-dependency
          ref: 133fae8b8b48ffcbc57b2b2d54b2416580e1b8f8
      - name: Assert real Redeem and reversal through Multi-day payout
        run: bash VinPoker/supabase/pending-tests/multiday_real_satellite_bridge_v1.sh "$PWD/VinPoker" "$PWD/satellite-dependency/VinPoker"
