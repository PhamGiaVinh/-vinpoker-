name: Floor Table Control V3 disposable PostgreSQL

on:
  pull_request:
    paths:
      - "VinPoker/supabase/migrations/20270113000002_floor_table_control_v3_foundation.sql"
      - "VinPoker/tests/floorTableControlV3/**"
      - ".github/workflows/floor-table-control-v3-disposable-db.yml"
  push:
    branches:
      - "agent/floor-table-control-v3"

permissions:
  contents: read

jobs:
  floor-table-control-v3:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: floor_table_control_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floor_table_control_v3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts
      - name: Verify source contract
        working-directory: VinPoker
        run: ./node_modules/.bin/vitest run --config tests/floorTableControlV3/vitest.foundation.config.ts
      - name: Run disposable PostgreSQL foundation
        working-directory: VinPoker
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: floor_table_control_v3
        run: psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.foundation.sql
