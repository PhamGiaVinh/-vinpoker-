name: Protected migration sequence integrated UAT

on:
  pull_request:
    paths:
      - ".github/workflows/protected-nine-integrated-uat.yml"
      - "VinPoker/scripts/ops/protected-nine-*"
      - "VinPoker/tests/protectedNineIntegratedUat/**"
      - "VinPoker/supabase/migration-control/manifest.json"
      - "VinPoker/supabase/migrations/202701280000*.sql"

permissions:
  actions: read
  contents: read

jobs:
  postgres-17-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: protected_nine_uat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d protected_nine_uat"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: protected_nine_uat
      PGPASSWORD: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Download and validate owner-authorized sanitized schema baseline
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36422707061" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36422707061" --jq .head_sha)" = d64df388d42b51cb851e8d23361d4fe568988eb7
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36422707061/artifacts" --jq '[.artifacts[] | select(.name=="live-public-schema" and .expired==false)] | if length==1 then .[0].id else error("exact schema artifact missing") end')"
          mkdir "$RUNNER_TEMP/protected-nine-schema"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/protected-nine-schema.zip"
          unzip -q "$RUNNER_TEMP/protected-nine-schema.zip" -d "$RUNNER_TEMP/protected-nine-schema"
          node VinPoker/scripts/deploy/validate-live-public-schema-artifact.mjs --artifact-directory "$RUNNER_TEMP/protected-nine-schema"
          test "$(cut -d' ' -f1 "$RUNNER_TEMP/protected-nine-schema/live-public-schema.sha256")" = 703aed6b620cd24f34c31d4545b2d7e97e4a488f89fe81dfc1a36b175d259223
      - name: Restore baseline and apply the complete exact sequence on one intact database
        id: exact_sequence
        continue-on-error: true
        working-directory: VinPoker
        env:
          PROTECTED_NINE_SCHEMA_ARTIFACT_DIR: "${{ runner.temp }}/protected-nine-schema"
          PROTECTED_NINE_CONTRACT_OUTPUT: "${{ runner.temp }}/protected-nine-object-contract.json"
        run: node --test scripts/ops/protected-nine-release-gate.pg17.test.mjs
      - name: Post-sequence runtime and ACL probes
        id: post_sequence
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/postNineRuntime.sql
      - name: Multi-day child trigger binding regression
        id: multi_day_guard
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/multiDayGuard.pg17.sql
      - name: Dealer Swing contained operator and worker runtime
        id: dealer_swing
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/dealerSwing.pg17.sql
      - name: TV Stage A and B reader editor runtime
        id: tv
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/tv.pg17.sql
      - name: History lease commit crash public and reparent runtime
        id: history
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/history.pg17.sql
      - name: Tracker correction real DB actor and concurrency coverage
        id: correction
        continue-on-error: true
        working-directory: VinPoker
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink;'
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION public.tracker_voice_test_assert(ok boolean,message text) RETURNS void LANGUAGE plpgsql AS \$\$ BEGIN IF ok IS NOT TRUE THEN RAISE EXCEPTION 'assertion_failed: %',message; END IF; END \$\$;"
          psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/trackerCorrectionFloorAuthority.pg17.sql
      - name: Floor partial authorization and source probes
        id: floor
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/floor.pg17.sql
      - name: Tracker Voice and Swing interleave real DB coverage
        id: voice_swing
        continue-on-error: true
        working-directory: VinPoker
        run: psql -X -v ON_ERROR_STOP=1 -f tests/protectedNineIntegratedUat/trackerVoiceSwing.integration.sql
      - name: Record machine-readable UAT report
        if: always()
        working-directory: VinPoker
        env:
          BASELINE_RUN: "36422707061"
          BASELINE_SHA256: "703aed6b620cd24f34c31d4545b2d7e97e4a488f89fe81dfc1a36b175d259223"
          PG17_IMAGE: "postgres:17"
          UAT_DOMAIN_RESULTS: '{"dealerSwing":"${{ steps.dealer_swing.outcome }}","tv":"${{ steps.tv.outcome }}","historyQueueAudit":"${{ steps.history.outcome }}","trackerCorrection":"${{ steps.correction.outcome }}","floor":"INCOMPLETE_RUNTIME_CAS_DEFER_EXACTLY_ONCE","trackerVoice":"${{ steps.voice_swing.outcome }}"}'
        run: node scripts/ops/protected-nine-uat-report.mjs "$RUNNER_TEMP/protected-nine-uat-report.json"
      - name: Upload machine-readable UAT report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-nine-integrated-uat-${{ github.run_id }}
          path: ${{ runner.temp }}/protected-nine-uat-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail unless every integrated domain passed
        if: always()
        run: |
          node - "$RUNNER_TEMP/protected-nine-uat-report.json" <<'NODE'
          const { readFileSync } = require("node:fs");
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const requiredDomains = [
            "dealerSwing",
            "tv",
            "historyQueueAudit",
            "trackerCorrection",
            "floor",
            "trackerVoice",
          ];
          const failures = requiredDomains.filter((domain) => report.domains?.[domain] !== "success");
          if (failures.length > 0) {
            throw new Error(`integrated UAT domains not passed: ${failures.join(", ")}`);
          }
          NODE
          test '${{ steps.exact_sequence.outcome }}' = success
          test '${{ steps.post_sequence.outcome }}' = success
          test '${{ steps.multi_day_guard.outcome }}' = success
          test '${{ steps.dealer_swing.outcome }}' = success
          test '${{ steps.tv.outcome }}' = success
          test '${{ steps.history.outcome }}' = success
          test '${{ steps.correction.outcome }}' = success
          test '${{ steps.floor.outcome }}' = success
          test '${{ steps.voice_swing.outcome }}' = success
