name: Protected nine exact owner-gated migration apply

on:
  workflow_dispatch:
    inputs:
      release_sha: { description: "Exact reviewed 40-character source SHA", required: true, type: string }
      project_ref: { description: "Production project", required: true, type: choice, options: [orlesggcjamwuknxwcpk] }
      migration_filename: { description: "Exact next 20270128000001..00009 migration filename", required: true, type: string }
      normalized_sql_sha256: { description: "Exact normalized SQL SHA-256 from migration-control", required: true, type: string }
      recovery_run_id: { description: "Fresh successful restore-verified recovery workflow run ID", required: true, type: string }
      confirmation_phrase: { description: "APPLY_PROTECTED_NINE_<version>_<hash>", required: true, type: string }
      tv_stage_a_frontend_sha: { description: "Required only for 00003: deployed compatible frontend SHA", required: false, type: string }
      tv_stage_a_auth_uat: { description: "Required only for 00003: PASS", required: false, type: string }

permissions: { actions: read, contents: read }
concurrency: { group: vinpoker-production-database-release, cancel-in-progress: false }
env:
  PROJECT_REF: orlesggcjamwuknxwcpk
  RECOVERY_WORKFLOW: floor-v3-recovery-backup.yml

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 1 }
      - name: Fail closed on source, actor, project, manifest, and unit checks
        working-directory: VinPoker
        env:
          INITIAL_ACTOR: "${{ github.actor }}"
          TRIGGERING_ACTOR: "${{ github.triggering_actor }}"
          REPOSITORY_OWNER: "${{ github.repository_owner }}"
          RELEASE_SHA: "${{ inputs.release_sha }}"
          INPUT_PROJECT_REF: "${{ inputs.project_ref }}"
          TARGET_MIGRATION: "${{ inputs.migration_filename }}"
          TARGET_NORMALIZED_SHA256: "${{ inputs.normalized_sql_sha256 }}"
        run: |
          set -euo pipefail
          test "$INITIAL_ACTOR" = "$REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          test "$INPUT_PROJECT_REF" = "$PROJECT_REF"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm run check:migration-control
          node --test scripts/ops/protected-nine-release-gate.test.mjs

  recovery:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require a fresh successful restore-verified artifact
        env: { GH_TOKEN: "${{ github.token }}", RECOVERY_RUN_ID: "${{ inputs.recovery_run_id }}" }
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          test "$(jq -r .workflow_id <<<"$run")" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RECOVERY_WORKFLOW" --jq .id)"
          test "$(jq -r .name <<<"$run")" = "Floor V3 encrypted recovery backup and restore verification"
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .conclusion <<<"$run")" = success
          log="$RUNNER_TEMP/recovery.log"; gh run view "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --log >"$log"
          snapshot="$(sed -n 's/.*SNAPSHOT_AT=\([0-9T:.+-]*Z\).*/\1/p' "$log" | tail -1)"
          [[ "$snapshot" =~ Z$ ]]
          (( $(date -u +%s) - $(date -u -d "$snapshot" +%s) <= 3600 ))
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts")"
          jq -e '[.artifacts[] | select(.expired == false and .size_in_bytes > 0)] | length == 1' <<<"$artifacts"

  apply:
    needs: [validate, recovery]
    environment: dealer-swing-production-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 1 }
      - name: Stop if another production apply/release is active
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select((.id|tostring) != env.GITHUB_RUN_ID) | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested") | select(.name | test("database|migration|protected.*apply|release";"i")) | .id')"
          test -z "$active"
      - name: Plan exact next entry
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: "${{ inputs.project_ref }}"
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASEACCESSTOKEN }}"
          TARGET_MIGRATION: "${{ inputs.migration_filename }}"
          TARGET_NORMALIZED_SHA256: "${{ inputs.normalized_sql_sha256 }}"
          TV_STAGE_A_FRONTEND_SHA: "${{ inputs.tv_stage_a_frontend_sha }}"
          TV_STAGE_A_AUTH_UAT: "${{ inputs.tv_stage_a_auth_uat }}"
        run: node scripts/ops/protected-nine-release-gate.mjs plan
      - name: Apply one atomic migration and immutable receipt
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: "${{ inputs.project_ref }}"
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASEACCESSTOKEN }}"
          TARGET_MIGRATION: "${{ inputs.migration_filename }}"
          TARGET_NORMALIZED_SHA256: "${{ inputs.normalized_sql_sha256 }}"
          TV_STAGE_A_FRONTEND_SHA: "${{ inputs.tv_stage_a_frontend_sha }}"
          TV_STAGE_A_AUTH_UAT: "${{ inputs.tv_stage_a_auth_uat }}"
          CONFIRM_PROTECTED_NINE: "${{ inputs.confirmation_phrase }}"
        run: node scripts/ops/protected-nine-release-gate.mjs apply
      - name: Exact receipt, object, and ACL postchecks
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: "${{ inputs.project_ref }}"
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASEACCESSTOKEN }}"
          TARGET_MIGRATION: "${{ inputs.migration_filename }}"
          TARGET_NORMALIZED_SHA256: "${{ inputs.normalized_sql_sha256 }}"
          TV_STAGE_A_FRONTEND_SHA: "${{ inputs.tv_stage_a_frontend_sha }}"
          TV_STAGE_A_AUTH_UAT: "${{ inputs.tv_stage_a_auth_uat }}"
        run: node scripts/ops/protected-nine-release-gate.mjs postcheck
