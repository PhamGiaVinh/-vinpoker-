name: Satellite funding preview disposable PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/satellite-funding-preview-disposable-db.yml"
      - "VinPoker/supabase/pending-migrations/20260925092509_satellite_funding_preview_math_v1.sql"
      - "VinPoker/supabase/pending-tests/satellite_funding_preview_math_v1.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satellite-funding-preview-disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - name: Add synthetic Supabase API roles to disposable PostgreSQL only
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: Apply pending calculation migration to disposable PostgreSQL only
        working-directory: VinPoker
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20260925092509_satellite_funding_preview_math_v1.sql
      - name: Run Satellite golden arithmetic and input boundary assertions
        working-directory: VinPoker
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/pending-tests/satellite_funding_preview_math_v1.sql
