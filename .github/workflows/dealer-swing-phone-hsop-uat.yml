name: Dealer Swing phone HSOP - controlled runtime gate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact reviewed main SHA containing the guarded UAT runner"
        required: true
        type: string
      mode:
        description: "Read-only preflight, enable HSOP, or emergency disable HSOP"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - enable_hsop
          - disable_hsop
      confirmation:
        description: "ENABLE_DEALER_SWING_PHONE_COMPLETION_HSOP or DISABLE_DEALER_SWING_PHONE_COMPLETION_HSOP"
        required: true
        default: HOLD
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: dealer-swing-phone-hsop-runtime-gate
  cancel-in-progress: false

env:
  CRITICAL_ENVIRONMENT: dealer-swing-production-critical

jobs:
  validate-critical-environment:
    name: Require protected critical environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless required reviewers are configured
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${CRITICAL_ENVIRONMENT}")"
          jq -e '
            .protection_rules
            | any(.type == "required_reviewers" and ((.reviewers // []) | length > 0))
          ' <<<"$environment_json" >/dev/null

  runtime-gate:
    needs: validate-critical-environment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dealer-swing-production-critical
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact SHA belongs to current main
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          case "$MODE" in
            preflight) test "$CONFIRMATION" = "HOLD" ;;
            enable_hsop) test "$CONFIRMATION" = "ENABLE_DEALER_SWING_PHONE_COMPLETION_HSOP" ;;
            disable_hsop) test "$CONFIRMATION" = "DISABLE_DEALER_SWING_PHONE_COMPLETION_HSOP" ;;
            *) exit 1 ;;
          esac

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validate exact runtime gate runner
        working-directory: VinPoker
        run: node --test scripts/dealer-swing/set-phone-completion-hsop-uat.test.mjs

      - name: Preflight or change the exact HSOP runtime gate
        working-directory: VinPoker
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
          CONFIRM_DEALER_SWING_PHONE_HSOP: ${{ inputs.confirmation }}
        run: |
          case "${{ inputs.mode }}" in
            preflight) node scripts/dealer-swing/set-phone-completion-hsop-uat.mjs --preflight ;;
            enable_hsop) node scripts/dealer-swing/set-phone-completion-hsop-uat.mjs --enable-hsop ;;
            disable_hsop) node scripts/dealer-swing/set-phone-completion-hsop-uat.mjs --disable-hsop ;;
            *) exit 1 ;;
          esac
