name: Tracker record_action authority hotfix disposable PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/tracker-record-action-authority-hotfix-db.yml"
      - "VinPoker/supabase/migrations/20270112000003_tracker_voice_player_analytics_v0.sql"
      - "VinPoker/supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql"
      - "VinPoker/supabase/functions/tournament-live-update/index.ts"
      - "VinPoker/src/components/cashier/tournament-live/handinput/**"
      - "VinPoker/tests/trackerRecordActionAuthority/**"
      - "VinPoker/tests/trackerVoice/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-record-action-authority-hotfix-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install source-test dependencies without install hooks
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Create local current-schema baseline and rollback copy
        working-directory: VinPoker
        run: |
          set -euo pipefail
          createdb tracker_record_action_authority
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority \
            -f tests/trackerUnifiedOps/disposableDb.baseline.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority \
            -f supabase/migrations/20270108000003_tracker_unified_ops_v2_context_safe_start.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority \
            -f tests/trackerVoice/disposableDb.dependencies.sql
          createdb tracker_record_action_authority_rollback -T tracker_record_action_authority

      - name: Apply exact hotfix and run authenticated lock suite
        working-directory: VinPoker
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority \
            -f supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority \
            -f tests/trackerRecordActionAuthority/disposableDb.integration.sql

      - name: Prove exact migration transaction rollback
        working-directory: VinPoker
        run: |
          set -euo pipefail
          failing="$RUNNER_TEMP/tracker-record-action-authority-failing.sql"
          awk '{ if ($0 == "COMMIT;") print "SELECT 1 / 0 AS tracker_record_action_authority_injected_failure;"; print }' \
            supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql > "$failing"
          if psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_authority_rollback -f "$failing"; then
            echo "Injected authority migration unexpectedly committed" >&2
            exit 1
          fi
          rollback_state="$(psql -X -At -d tracker_record_action_authority_rollback -c \
            "SELECT to_regprocedure('public.record_action(uuid,uuid,text,integer,integer,text,integer,text,text,uuid)') IS NULL
                    AND to_regprocedure('public.heartbeat_lock(uuid,uuid)') IS NULL")"
          test "$rollback_state" = "t"
          echo "TRACKER_RECORD_ACTION_AUTHORITY_ROLLBACK=PASS"

      - name: Prove revised Voice migration preserves strict lock authority
        working-directory: VinPoker
        run: |
          set -euo pipefail
          createdb tracker_record_action_voice_chain
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f tests/trackerUnifiedOps/disposableDb.baseline.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f supabase/migrations/20270108000003_tracker_unified_ops_v2_context_safe_start.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f tests/trackerVoice/disposableDb.dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f supabase/migrations/20270112000003_tracker_voice_player_analytics_v0.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f supabase/migrations/20270112000008_tracker_voice_gemini_live_provider.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f supabase/migrations/20270113000007_tracker_voice_transcribe35_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_record_action_voice_chain \
            -f tests/trackerVoice/disposableDb.integration.sql
          echo "TRACKER_RECORD_ACTION_VOICE_CHAIN=PASS"

      - name: Run focused contract, client and Edge checks
        working-directory: VinPoker
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs run \
            src/components/cashier/tournament-live/handinput/handLockClaim.test.ts \
            tests/trackerRecordActionAuthority/migration.contract.test.ts \
            tests/trackerVoice/migration.contract.test.ts \
            --maxWorkers=1 --minWorkers=1
          node ./node_modules/typescript/bin/tsc \
            -p tsconfig.tracker-record-action-authority-hotfix.json \
            --pretty false
          deno check supabase/functions/tournament-live-update/index.ts
          git diff --check
