name: Tracker start_hand authority hotfix disposable PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/tracker-start-hand-authority-hotfix-db.yml"
      - "VinPoker/supabase/migrations/20270105000004_floor_table_control_mode.sql"
      - "VinPoker/supabase/migrations/20260928000000_tracker_lock_activation_idempotency_trace.sql"
      - "VinPoker/supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql"
      - "VinPoker/supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql"
      - "VinPoker/supabase/functions/tournament-live-update/index.ts"
      - "VinPoker/src/components/cashier/tournament-live/handinput/**"
      - "VinPoker/tests/trackerStartHandAuthority/**"
      - "VinPoker/tests/trackerRecordActionAuthority/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-start-hand-authority-hotfix-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install source-test dependencies without install hooks
        working-directory: VinPoker
        run: npm ci --ignore-scripts

      - name: Create disposable current-production baseline
        working-directory: VinPoker
        run: |
          set -euo pipefail
          createdb tracker_start_hand_authority
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f tests/trackerUnifiedOps/disposableDb.baseline.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f tests/trackerVoice/disposableDb.dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f supabase/migrations/20260928000000_tracker_lock_activation_idempotency_trace.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f supabase/migrations/20270105000004_floor_table_control_mode.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f supabase/migrations/20261221000000_tracker_lock_takeover.sql
          createdb tracker_start_hand_authority_rollback -T tracker_start_hand_authority

      - name: Apply exact hotfix chain and run lock authority matrix
        working-directory: VinPoker
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority -f tests/trackerStartHandAuthority/disposableDb.integration.sql

      - name: Prove exact hotfix transaction rollback
        working-directory: VinPoker
        run: |
          set -euo pipefail
          read -r -d '' rollback_snapshot_sql <<'SQL' || true
          SELECT md5(string_agg(oid::regprocedure::text || E'\n' || pg_get_functiondef(oid) || E'\n' || coalesce(array_to_string(proacl, ';'), ''), E'\n---\n' ORDER BY oid::regprocedure::text)) FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND proname IN ('start_hand', 'heartbeat_lock', 'update_community_cards', 'show_hole_cards', 'delete_last_action');
          SQL
          rollback_before="$(psql -X -At -d tracker_start_hand_authority_rollback -c "$rollback_snapshot_sql")"
          failing="$RUNNER_TEMP/tracker-start-hand-authority-failing.sql"
          awk '{ if ($0 == "COMMIT;") print "SELECT 1 / 0 AS tracker_start_hand_authority_injected_failure;"; print }' \
            supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql > "$failing"
          if psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_authority_rollback -f "$failing"; then
            echo "Injected authority migration unexpectedly committed" >&2
            exit 1
          fi
          rollback_after="$(psql -X -At -d tracker_start_hand_authority_rollback -c "$rollback_snapshot_sql")"
          test "$rollback_before" = "$rollback_after"
          echo "TRACKER_START_HAND_AUTHORITY_ROLLBACK=PASS"

      - name: Prove the future Voice chain cannot overwrite start authority
        working-directory: VinPoker
        run: |
          set -euo pipefail
          createdb tracker_start_hand_voice_chain
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f tests/trackerUnifiedOps/disposableDb.baseline.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f supabase/migrations/20270105000004_floor_table_control_mode.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f supabase/migrations/20270108000003_tracker_unified_ops_v2_context_safe_start.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f tests/trackerVoice/disposableDb.dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f supabase/migrations/20270112000003_tracker_voice_player_analytics_v0.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f supabase/migrations/20270112000004_tracker_record_action_authority_binding.sql
          psql -X -v ON_ERROR_STOP=1 -d tracker_start_hand_voice_chain -f supabase/migrations/20270112000005_tracker_start_hand_authority_binding.sql
          test "$(psql -X -At -d tracker_start_hand_voice_chain -c \
            "SELECT position('v_actor_user_id UUID := auth.uid()' IN pg_get_functiondef('public.start_hand(uuid,uuid,integer,timestamp with time zone,uuid,integer)'::regprocedure)) > 0")" = "t"
          test "$(psql -X -At -d tracker_start_hand_voice_chain -c \
            "SELECT position('p_created_by IS NOT NULL AND p_created_by <> v_actor_user_id' IN pg_get_functiondef('public.start_hand(uuid,uuid,integer,timestamp with time zone,uuid,integer)'::regprocedure)) > 0")" = "t"
          echo "TRACKER_START_HAND_AUTHORITY_VOICE_CHAIN=PASS"

      - name: Run focused contract, client and Edge checks
        working-directory: VinPoker
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs run \
            src/components/cashier/tournament-live/handinput/handLockClaim.test.ts \
            tests/trackerStartHandAuthority/migration.contract.test.ts \
            tests/trackerRecordActionAuthority/migration.contract.test.ts \
            --maxWorkers=1 --minWorkers=1
          node ./node_modules/typescript/bin/tsc -p tsconfig.tracker-start-hand-authority-hotfix.json --pretty false
          deno check supabase/functions/tournament-live-update/index.ts
          git diff --check
