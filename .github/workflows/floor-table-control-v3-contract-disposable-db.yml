name: Floor Table Control V3 server contract

on:
  pull_request:
    paths:
      - "VinPoker/supabase/migrations/20270112000009_floor_table_control_v3_fixture_live_status_compat.sql"
      - "VinPoker/supabase/migrations/20270113000010_floor_table_control_v3_final_live_bridge.sql"
      - "VinPoker/supabase/migrations/20270113000011_floor_table_control_v3_final_contract.sql"
      - "VinPoker/supabase/migrations/20270114000006_tracker_roster_canonical_entry_link.sql"
      - "VinPoker/supabase/migrations/20270114000007_floor_v3_roster_seat_display_name.sql"
      - "VinPoker/supabase/migrations/20270114000011_floor_redraw_seat_lock_v1.sql"
      - "VinPoker/supabase/migrations/20270114000012_floor_v3_numbered_available_table.sql"
      - "VinPoker/supabase/migration-archive/remote-history/recovered-source/20270115000004_floor_free_sit_v1.sql"
      - "VinPoker/supabase/migrations/20270115000005_floor_roster_actions_repair.sql"
      - "VinPoker/supabase/migrations/20270115000006_floor_break_eligible_destinations.sql"
      - "VinPoker/supabase/migrations/20270115000007_floor_deferred_tracker_move_v1.sql"
      - "VinPoker/supabase/migrations/20270115000008_floor_v3_tracker_legacy_projection.sql"
      - "VinPoker/scripts/production/repairs/repair_tracker_test_roster_entries_ban5.sql"
      - "VinPoker/scripts/production/repairs/repair_tracker_test_roster_tournament_table_link_ban5.sql"
      - "VinPoker/src/lib/floorTableControlV3.ts"
      - "VinPoker/tests/floorTableControlV3/deferredTrackerMove.disposable.sql"
      - "VinPoker/src/lib/featureFlags.ts"
      - "VinPoker/src/components/cashier/tournament-live/FloorTableMapPanelV3.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorTableMapPanel.tsx"
      - "VinPoker/src/components/cashier/tournament-live/OpenTableDialog.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorRedrawDialogV1.tsx"
      - "VinPoker/src/components/ops/shared/FloorSeatRoster.tsx"
      - "VinPoker/src/components/ops/shared/FloorTableNumberPicker.tsx"
      - "VinPoker/src/components/tv/TvRedrawScreen.tsx"
      - "VinPoker/src/hooks/useTournamentRedrawTv.ts"
      - "VinPoker/tests/floorTableControlV3/**"
      - "VinPoker/tests/floorRedrawSeatLockV1/**"
      - ".github/workflows/floor-table-control-v3-contract-disposable-db.yml"
  push:
    branches:
      - "agent/floor-table-control-v3-contract"

permissions:
  contents: read

jobs:
  floor-table-control-v3-server-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: floor_table_control_v3_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floor_table_control_v3_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts
      - name: Verify server contract source
        working-directory: VinPoker
        run: ./node_modules/.bin/vitest run --config tests/floorTableControlV3/vitest.serverContract.config.ts
      - name: Run disposable PostgreSQL server contract
        working-directory: VinPoker
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: floor_table_control_v3_contract
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.authenticated.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.concurrent.setup.sql
          bash tests/floorTableControlV3/runServerContractConcurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/repairTrackerTestRoster.fixture.sql
          bash tests/floorTableControlV3/runPartialTableLinkRepair.sh
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/rosterActionsRepair.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/deferredTrackerMove.writerDependencies.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/deferredTrackerMove.disposable.sql
