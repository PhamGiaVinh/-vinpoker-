    paths:
      - "VinPoker/supabase/migrations/20270112000009_floor_table_control_v3_fixture_live_status_compat.sql"
      - "VinPoker/supabase/migrations/20270113000010_floor_table_control_v3_final_live_bridge.sql"
      - "VinPoker/supabase/migrations/20270113000011_floor_table_control_v3_final_contract.sql"
      - "VinPoker/supabase/migrations/20270114000006_tracker_roster_canonical_entry_link.sql"
      - "VinPoker/supabase/migrations/20270114000007_floor_v3_roster_seat_display_name.sql"
      - "VinPoker/supabase/migrations/20270114000011_floor_redraw_seat_lock_v1.sql"
      - "VinPoker/supabase/migrations/20270114000012_floor_v3_numbered_available_table.sql"
      - "VinPoker/supabase/pending-migrations/20260924165219_centerpoint_tournament_ops_release_v1.sql"
      - "VinPoker/supabase/pending-migrations/20270126000001_redraw_clock_hold_v1.sql"
      - "VinPoker/supabase/migration-archive/remote-history/recovered-source/20270115000004_floor_free_sit_v1.sql"
      - "VinPoker/supabase/migrations/20270115000006_floor_roster_actions_repair.sql"
      - "VinPoker/supabase/migrations/20270115000007_floor_break_eligible_destinations.sql"
      - "VinPoker/supabase/migrations/20270115000008_floor_deferred_tracker_move_v1.sql"
      - "VinPoker/supabase/migrations/20270115000009_tracker_record_hand_v3_identity.sql"
      - "VinPoker/supabase/migrations/20270115000010_tracker_v3_hand_start_context.sql"
      - "VinPoker/supabase/migrations/20270128000007_floor_v3_critical_consistency.sql"
      - "VinPoker/supabase/migrations/20270128000013_floor_mode_request_safe_boundary_v1.sql"
      - "VinPoker/supabase/migrations/20270128000015_floor_restore_bust_integrity_v1.sql"
      - "VinPoker/supabase/migrations/20270128000049_floor_mode_tombstone_guard_v1.sql"
      - "VinPoker/supabase/migrations/20270128000050_floor_mode_retry_schedule_v1.sql"
      - "VinPoker/supabase/migrations/20270128000052_floor_restore_receipt_reconciliation_v1.sql"
      - "VinPoker/supabase/migrations/20270128000054_restore_pending_cancellation_v1.sql"
      - "VinPoker/scripts/ops/floor-49-50-*.mjs"
      - ".github/workflows/floor-49-50-protected-apply.yml"
      - "VinPoker/scripts/production/repairs/repair_tracker_test_roster_entries_ban5.sql"
      - "VinPoker/scripts/production/repairs/repair_tracker_test_roster_tournament_table_link_ban5.sql"
      - "VinPoker/src/lib/floorTableControlV3.ts"
      - "VinPoker/tests/floorTableControlV3/deferredTrackerMove.disposable.sql"
      - "VinPoker/src/lib/featureFlags.ts"
      - "VinPoker/src/components/cashier/tournament-live/FloorTableMapPanelV3.tsx"
      - "VinPoker/src/components/cashier/tournament-live/RestoreBustDialog.tsx"
      - "VinPoker/src/components/cashier/tournament-live/RestoreBustDialog.test.tsx"
      - "VinPoker/src/components/cashier/tournament-live/PlayersGroupedPanel.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorTableMapPanel.tsx"
      - "VinPoker/src/components/cashier/tournament-live/OpenTableDialog.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorRedrawDialogV1.tsx"
      - "VinPoker/src/components/cashier/tournament-live/FloorRedrawDialogV1.test.tsx"
      - "VinPoker/src/components/tv/TvRedrawScreen.tsx"
      - "VinPoker/src/pages/TournamentTv.tsx"
      - "VinPoker/src/hooks/useTournamentRedrawTv.ts"
      - "VinPoker/src/hooks/useTournamentRedrawTv.test.ts"
      - "VinPoker/src/components/chip-ops/ColorUpTab.tsx"
      - "VinPoker/src/components/chip-ops/ColorUpTab.test.tsx"
      - "VinPoker/src/lib/floorTableControlV3.ts"
      - "VinPoker/src/lib/floorTableControlV3.test.ts"
      - "VinPoker/src/components/ops/shared/FloorSeatRoster.tsx"
      - "VinPoker/src/components/ops/shared/FloorTableNumberPicker.tsx"
      - "VinPoker/src/components/tv/TvRedrawScreen.tsx"
      - "VinPoker/src/hooks/useTournamentRedrawTv.ts"
      - "VinPoker/tests/floorTableControlV3/**"
      - "VinPoker/tests/floorRedrawSeatLockV1/**"
      - "VinPoker/tests/redrawClockHoldV1/**"
      - "VinPoker/tests/floorTableControlV3/disposableDb.serverContract.sql"
      - "VinPoker/tests/floorTableControlV3/redrawClockHold.disposable.sql"
      - "VinPoker/tests/floorTableControlV3/runRedrawContinueStartHandRace.sh"
      - "VinPoker/tests/floorTableControlV3/vitest.serverContract.config.ts"
      - ".github/workflows/floor-table-control-v3-contract-disposable-db.yml"
  push:
    branches:
      - "agent/floor-table-control-v3-contract"

permissions:
  contents: read

jobs:
  floor-table-control-v3-server-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same Docker Official Image digest; avoid Docker Hub's shared-runner pull quota.
        image: public.ecr.aws/docker/library/postgres@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: floor_table_control_v3_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floor_table_control_v3_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VinPoker/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: VinPoker
        run: npm ci --ignore-scripts
      - name: Verify server contract source
        working-directory: VinPoker
        run: ./node_modules/.bin/vitest run --config tests/floorTableControlV3/vitest.serverContract.config.ts
      - name: Verify exact49/50 protected release preparation
        working-directory: VinPoker
        run: node --test scripts/ops/floor-49-50-release-plan.test.mjs scripts/ops/floor-49-50-protected-apply.test.mjs
      - name: Verify redraw client, TV timing, and Floor Continue UI
        working-directory: VinPoker
        run: >-
          ./node_modules/.bin/vitest run
          src/lib/floorTableControlV3.test.ts
          tests/floorFreeSitV1/rosterActions.interaction.test.tsx
          src/components/cashier/tournament-live/RestoreBustDialog.test.tsx
          src/hooks/useDealerManagement.test.tsx
          src/components/chip-ops/ColorUpTab.test.tsx
          src/hooks/useTournamentRedrawTv.test.ts
          src/components/cashier/tournament-live/FloorRedrawDialogV1.test.tsx
      - name: Run disposable PostgreSQL server contract
        working-directory: VinPoker
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: floor_table_control_v3_contract
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.authenticated.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/disposableDb.serverContract.concurrent.setup.sql
          bash tests/floorTableControlV3/runServerContractConcurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/repairTrackerTestRoster.fixture.sql
          bash tests/floorTableControlV3/runPartialTableLinkRepair.sh
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/rosterActionsRepair.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/deferredTrackerMove.writerDependencies.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/deferredTrackerMove.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/redrawClockHold.disposable.sql
          bash tests/floorTableControlV3/runRedrawContinueStartHandRace.sh
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/criticalConsistency.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/tableModeRequest.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/restoreBustIntegrity.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/restoreReceipt.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/restoreCancellation.disposable.sql
          createdb -T "$PGDATABASE" vinpoker_ops_restore_cancel_ci
          PGDATABASE=vinpoker_ops_restore_cancel_ci RESTORE_CANCEL_TEST_PORT=5432 node tests/floorTableControlV3/restoreCancellation.concurrent.mjs
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20270128000049_floor_mode_tombstone_guard_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/tableModeTombstone.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/tableModeQueuedTombstone.disposable.sql
          psql -v ON_ERROR_STOP=1 -f tests/floorTableControlV3/tableModeRetryFairness.disposable.sql
          bash tests/floorTableControlV3/runModeTombstoneRace.sh
          bash tests/floorTableControlV3/runModeRetryRace.sh
          bash tests/floorTableControlV3/runModeRequestLockRace.sh
          bash tests/floorTableControlV3/runModeLockedFairness.sh
      - name: Verify atomic49 receipt rollback on a fresh PostgreSQL schema
        working-directory: VinPoker
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: vinpoker_ops_atomic49_ci
          FLOOR49_LOCAL_DATABASE: vinpoker_ops_atomic49_ci
        run: |
          createdb vinpoker_ops_atomic49_ci
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/floorTableControlV3/disposableDb.serverContract.sql \
            -f tests/floorTableControlV3/disposableDb.serverContract.authenticated.sql \
            -f tests/floorTableControlV3/repairTrackerTestRoster.fixture.sql \
            -f tests/floorTableControlV3/repairTrackerTestRosterPartialTableLink.setup.sql \
            -f tests/floorTableControlV3/rosterActionsRepair.disposable.sql \
            -f tests/floorTableControlV3/deferredTrackerMove.writerDependencies.sql \
            -f tests/floorTableControlV3/deferredTrackerMove.disposable.sql \
            -f tests/floorTableControlV3/redrawClockHold.disposable.sql \
            -f tests/floorTableControlV3/criticalConsistency.disposable.sql \
            -f tests/floorTableControlV3/tableModeRequest.disposable.sql
          node --test scripts/ops/floor-49-50-atomic-pg.test.mjs
      - name: Typecheck the full application
        working-directory: VinPoker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ./node_modules/.bin/tsc -b --pretty false
      - name: Build the web bundle after typecheck
        working-directory: VinPoker
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: CI_PLACEHOLDER_ONLY
        run: npm run build
