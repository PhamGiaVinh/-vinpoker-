name: Public spectator v2 disposable PostgreSQL 17

on:
  pull_request:
    paths:
      - ".github/workflows/public-spectator-v2-disposable-db.yml"
      - "VinPoker/supabase/pending-migrations/2027011500000*_public_spectator_*.sql"
      - "VinPoker/supabase/pending-migrations/20270115000002_tournament_table_appearance.sql"
      - "VinPoker/supabase/pending-migrations/20260924070939_public_spectator_last_hand_history.sql"
      - "VinPoker/tests/publicSpectatorV2/**"

permissions:
  contents: read

jobs:
  public-spectator-v2-disposable-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated tournament and two-table baseline
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f tests/publicSpectatorV2/disposableDb.fixture.sql
      - name: Apply exact proposed migration to disposable PostgreSQL only
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20270115000000_public_spectator_realtime_v2.sql
      - name: Apply live display correction
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20270115000001_public_spectator_live_display.sql
      - name: Verify recorded cards, table isolation, and stale revision fencing
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f tests/publicSpectatorV2/disposableDb.integration.sql
      - name: Apply additive table appearance contract
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20270115000002_tournament_table_appearance.sql
      - name: Verify appearance tenant policy and hand blind identity
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f tests/publicSpectatorV2/tableAppearance.integration.sql
      - name: Apply current-session last hand and table history contract
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f supabase/pending-migrations/20260924070939_public_spectator_last_hand_history.sql
      - name: Verify current-session last hand and exact table history
        working-directory: VinPoker
        run: psql -v ON_ERROR_STOP=1 -f tests/publicSpectatorV2/lastHandHistory.integration.sql
