name: TV Stage A authenticated production UAT attestation

on:
  workflow_dispatch:
    inputs:
      release_sha: { description: "Exact reviewed main SHA already deployed to production", required: true, type: string }
      tv_tournament_id: { description: "Existing tournament checked in the production browser", required: true, type: string }
      browser_uat_ack: { description: "BROWSER_TV_READ_PASS_<exact release SHA> after viewing editor and tournament TV", required: true, type: string }

permissions: { contents: read, deployments: read }
concurrency: { group: tv-stage-a-production-uat, cancel-in-progress: false }

jobs:
  attest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: dealer-swing-production-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.release_sha }}", fetch-depth: 1 }
      - name: Verify owner, reviewed main and production deployment provenance
        id: provenance
        env: { GH_TOKEN: "${{ github.token }}", RELEASE_SHA: "${{ inputs.release_sha }}" }
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&sha=$RELEASE_SHA&per_page=20" --jq '[.[]] | if length==1 then .[0] else error("missing or ambiguous production deployment") end')"
          deployment_id="$(jq -r .id <<<"$deployment")"
          state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=20" --jq '.[0].state')"
          test "$state" = success
          echo "deployed_sha=$RELEASE_SHA" >>"$GITHUB_OUTPUT"
      - name: Run role-scoped read-only Stage A contract checks
        working-directory: VinPoker
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TV_TOURNAMENT_ID: ${{ inputs.tv_tournament_id }}
          BROWSER_UAT_ACK: ${{ inputs.browser_uat_ack }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYED_SHA: ${{ steps.provenance.outputs.deployed_sha }}
          OUTPUT_PATH: ${{ runner.temp }}/tv-stage-a-uat.json
        run: |
          docker pull postgres:17.6-bookworm >/dev/null
          node scripts/ops/tv-stage-a-auth-uat.mjs
      - name: Upload metadata-only UAT receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tv-stage-a-production-uat-${{ github.run_id }}
          path: ${{ runner.temp }}/tv-stage-a-uat.json
          if-no-files-found: error
          retention-days: 14

